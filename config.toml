cacheControlMaxAge = 3600 # Seconds

redisCacheTTL = 300 # Seconds

maxCustomBlacklists = 20 # Maximum number of custom blacklists allowed in POST requests

maxCustomNameservers = 3 # Maximum number of custom nameservers allowed in POST requests

maxRequestBodySize = 1048576 # Maximum request body size in bytes (1MB)

maxStringLength = 253 # Maximum length for domain names and blacklist entries (DNS standard)

dnsQueryTimeout = 5 # DNS query timeout in seconds

httpReadTimeout = 30 # HTTP read timeout in seconds

httpWriteTimeout = 30 # HTTP write timeout in seconds

httpIdleTimeout = 60 # Max time a keep-alive connection can be idle in seconds

httpReadHeaderTimeout = 10 # Max time to read request headers in seconds (defends against slow-header attacks)

# Trust X-Forwarded-For / X-Real-IP for the logged client IP.
# Enable ONLY when the service is reachable exclusively through a reverse proxy
# that overwrites those headers: otherwise any client can forge its own address.
trustProxyHeaders = false

# DNS servers used for blacklist lookups. Space- or newline-separated IP addresses.
# Empty (the default) uses the system resolver (/etc/resolv.conf — in Kubernetes,
# the cluster DNS), which keeps the shipped configuration working on any machine.
#
# Prefer a dedicated resolver in production: DNSBL providers rate-limit and
# eventually block queries coming from large public resolvers, and a blocked
# resolver answers with a refusal code rather than a real result.
nameServers = ""

listenPort = ":8080"

# Redis configuration
redisHost = "127.0.0.1"
redisPort = 6379
redisDatabase = 0
redisPassword = "" # Leave empty if no password is required

redisMaxIdle = 8 # Idle connections kept in the pool

redisMaxActive = 64 # Upper bound on concurrent Redis connections

redisConnTimeout = 2 # Connect/read/write timeout for Redis in seconds

# Background monitors: they keep the Redis PING and runtime.ReadMemStats
# (which stops the world) off the request path.
redisHealthCheckInterval = 5 # Redis availability probe interval in seconds

memStatsInterval = 10 # Memory sampling interval in seconds
