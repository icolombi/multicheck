# Security headers, included in every location of default.conf.template.
#
# nginx drops all inherited add_header directives as soon as a location declares
# one of its own, so declaring them at server level would silently lose them on
# the locations that set Cache-Control. Including this file everywhere keeps the
# set identical. "always" also applies them to error responses.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The UI has no reason to be framed: refuse it (old and new browsers).
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
