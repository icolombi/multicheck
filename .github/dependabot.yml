# Routine patch/minor updates are automated here; majors and cross-file
# decisions (Go minor vs Dockerfile tag, Node LTS line) stay with the
# dependency-audit skill. Majors are ignored on purpose for the same reason.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # Peer-linked families must move together or npm fails with ERESOLVE.
      svelte-kit:
        patterns: ["svelte", "@sveltejs/*", "vite", "@tailwindcss/*", "tailwindcss"]
      lint:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "eslint-plugin-*", "prettier*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories: ["/", "/frontend"]
    schedule:
      interval: weekly
    ignore:
      # Majors (e.g. the Node LTS line) are chosen by the skill, not by a bot.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # nginx odd minors are the mainline branch; the project runs stable (even
      # minors) only. Dependabot has no "odd only" matcher, so each odd branch is
      # listed explicitly (Ruby requirement syntax): extend when 1.39 is near.
      - dependency-name: "nginxinc/nginx-unprivileged"
        versions:
          - "~> 1.31.0"
          - "~> 1.33.0"
          - "~> 1.35.0"
          - "~> 1.37.0"
          - "~> 1.39.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
