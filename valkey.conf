# Valkey configuration file for multicheck

# Set maximum memory limit to 2GB
maxmemory 2gb

# Eviction policy: remove keys with expiration set using LRU algorithm
# Options:
# - volatile-lru: remove keys with expire set using LRU
# - allkeys-lru: remove any key using LRU
# - volatile-lfu: remove keys with expire set using LFU
# - allkeys-lfu: remove any key using LFU
# - volatile-random: remove random keys with expire set
# - allkeys-random: remove random keys
# - volatile-ttl: remove keys with nearest expire time
# - noeviction: return errors when memory limit is reached
maxmemory-policy allkeys-lru

# ===== MEMORY-ONLY CONFIGURATION =====
# Disable all disk persistence - pure cache mode

# Disable RDB snapshots (no disk saves)
save ""

# Disable AOF (Append Only File)
appendonly no

# Stop writing RDB on BGSAVE errors (not needed in memory-only mode)
stop-writes-on-bgsave-error no

# ===== END MEMORY-ONLY CONFIGURATION =====

# Log level
loglevel notice

# By default Valkey does not run as a daemon
daemonize no

# Bind to all interfaces (already default in Docker)
bind 0.0.0.0

# Protected mode (set to no when binding to all interfaces in Docker)
protected-mode no
