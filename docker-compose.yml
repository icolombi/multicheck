services:
  multicheck:
    build: .
    network_mode: host
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      - VALKEY_HOST=127.0.0.1
      - VALKEY_PORT=6379

  valkey:
    image: docker.io/valkey/valkey:9
    network_mode: host
    command: valkey-server /usr/local/etc/valkey/valkey.conf
    volumes:
      - ./valkey.conf:/usr/local/etc/valkey/valkey.conf:ro
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    network_mode: host
    environment:
      # In host network il backend occupa già la 8080
      - NGINX_PORT=5173
      - API_UPSTREAM=http://127.0.0.1:8080
    depends_on:
      - multicheck
    profiles:
      - frontend-prod

  frontend-dev:
    image: node:24-alpine
    network_mode: host
    working_dir: /app
    depends_on:
      - multicheck
    profiles:
      - frontend-dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "if [ ! -d node_modules ]; then npm ci; fi; npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  frontend_node_modules: